<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIPS ICON GALLERY (View Only)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Consolas&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --header-bg: #f4f4f4;
            --card-bg: #ffffff;
            --text-main: #000000;
            --accent-color: #0078d4;
            --border-color: #cccccc;
            --highlight-bg: #e6f7ff;
            --tab-active-bg: #ffffff;
            --tab-inactive-bg: #e0e0e0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header & Tabs --- */
        header {
            background-color: var(--header-bg);
            width: 100%;
            padding: 0;
            border-bottom: 1px solid #aaa;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .search-box input {
            padding: 4px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
            width: 200px;
            outline: none;
        }
        .search-box input:focus { border-color: var(--accent-color); }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background-color: var(--tab-inactive-bg);
            padding-top: 4px;
            padding-left: 10px;
            border-bottom: 1px solid #999;
            user-select: none;
        }

        .tab-btn {
            padding: 5px 25px;
            cursor: pointer;
            background-color: var(--tab-inactive-bg);
            border: 1px solid #999;
            border-bottom: none;
            margin-right: -1px; /* ให้เส้นซ้อนกัน */
            border-radius: 3px 3px 0 0;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            position: relative;
            top: 1px;
            transition: background 0.1s;
        }

        .tab-btn:hover { background-color: #eaeaea; }

        .tab-btn.active {
            background-color: var(--tab-active-bg);
            border-bottom: 1px solid var(--tab-active-bg);
            color: #000;
            z-index: 2;
        }

        /* --- Main Content Area --- */
        .container {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            padding: 5px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .grid {
            display: grid;
            /* Grid แน่นๆ Min 130px */
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 2px;
        }

        /* --- Card Style (Static View) --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            height: 36px; /* ความสูงคงที่ เล็กกะทัดรัด */
            display: flex;
            align-items: center;
            padding: 0 5px;
            border-radius: 0;
            position: relative;
            cursor: pointer; /* เป็นรูปมือเพื่อบอกว่าคลิก Copy ได้ */
            user-select: none;
        }

        .card:hover {
            background-color: var(--highlight-bg);
            border-color: var(--accent-color);
            z-index: 10;
        }

        .card img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            margin-right: 8px;
            pointer-events: none; /* ห้ามลากรูป */
        }

        .card-details {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .card-id {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #000;
            font-weight: normal;
            pointer-events: none; /* ห้ามคลิกแก้ไข */
        }

        /* Copy Feedback */
        .copy-msg {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 120, 212, 0.9);
            color: #fff;
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }
        .card.copied .copy-msg { opacity: 1; }

        /* Footer Info */
        .footer {
            width: 100%;
            background: #f4f4f4;
            border-top: 1px solid #ccc;
            padding: 2px 10px;
            font-size: 11px;
            color: #888;
            text-align: right;
            flex-shrink: 0;
        }

    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <h1>Blips Gallery</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search ID...">
            </div>
        </div>
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab(0)">BLIPS MP (Page 1)</div>
            <div class="tab-btn" onclick="switchTab(1)">BLIPS SP (Page 2)</div>
            <div class="tab-btn" onclick="switchTab(2)">BLIPS BIG (Page 3)</div>
        </div>
    </header>

    <div class="container">
        <div id="grid" class="grid"></div>
    </div>

    <div class="footer" id="countDisplay">Ready</div>

    <script>
        // =========================================================================
        //  ส่วนจัดการข้อมูล (DATA SECTION)
        // =========================================================================
        const FOLDER_PATH = "index.files/";
        
        // ช่วงของรูปภาพแต่ละหน้า
        const PAGES = [
            { name: "MP PAGE 1", start: 1, end: 523 },
            { name: "SP PAGE 2", start: 524, end: 1083 },
            { name: "BIG PAGE 3", start: 1084, end: 1195 }
        ];

        // -------------------------------------------------------------------------
        //  !!! วิธีใส่ข้อมูลเลข ID เดิม !!!
        //  เนื่องจากผมดึงข้อมูลจากไฟล์ sheet เก่าไม่ได้ คุณต้องนำข้อมูลมาวางตรงนี้ครับ
        //  รูปแบบ: { img: "ชื่อไฟล์", id: "เลขID" },
        // -------------------------------------------------------------------------
        const CUSTOM_DATA = [
            // ตัวอย่าง:
            // { img: "image001.png", id: "-1018164873" },
            // { img: "image002.png", id: "123456789" },
            // ... วางข้อมูลทั้งหมดต่อท้ายตรงนี้ ...
        ];

        // =========================================================================
        //  ระบบทำงาน (SYSTEM LOGIC)
        // =========================================================================

        let allIcons = [];
        let currentTab = 0;

        function init() {
            // สร้างรายการไอคอนทั้งหมด
            let baseData = [];
            const totalImages = PAGES[PAGES.length-1].end;
            
            for (let i = 1; i <= totalImages; i++) {
                const numStr = i.toString().padStart(3, '0');
                const filename = `image${numStr}.png`;
                
                // ตรวจสอบว่ามีข้อมูลใน CUSTOM_DATA หรือไม่
                const existing = CUSTOM_DATA.find(d => d.img === filename);
                
                baseData.push({
                    img: filename,
                    id: existing ? existing.id : "-" // ถ้าไม่มีข้อมูลให้แสดงขีด
                });
            }

            // แปลงข้อมูลเป็น format ที่ใช้ในเว็บ
            allIcons = baseData.map(item => ({
                id: item.id,
                filename: item.img,
                path: FOLDER_PATH + item.img
            }));

            renderPage(0); // แสดงหน้าแรก
        }

        function switchTab(tabIndex) {
            currentTab = tabIndex;
            
            // เปลี่ยนสถานะปุ่ม Tab
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((t, i) => {
                if (i === tabIndex) t.classList.add('active');
                else t.classList.remove('active');
            });

            // ล้างช่องค้นหาเมื่อเปลี่ยนหน้า
            document.getElementById('searchInput').value = '';
            
            renderPage(tabIndex);
        }

        function renderPage(pageIndex, filterText = '') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const range = PAGES[pageIndex];
            
            // กรองข้อมูล: ตามหน้า และ ตามคำค้นหา
            const itemsToShow = allIcons.filter(icon => {
                const num = parseInt(icon.filename.replace('image', '').replace('.png', ''));
                const isInPage = (num >= range.start && num <= range.end);
                
                if (!filterText) return isInPage;
                
                // ค้นหาจาก ID
                return isInPage && icon.id.toLowerCase().includes(filterText.toLowerCase());
            });

            // อัปเดตสถานะด้านล่าง
            document.getElementById('countDisplay').innerText = 
                `${PAGES[pageIndex].name}: แสดง ${itemsToShow.length} รายการ`;

            const fragment = document.createDocumentFragment();

            itemsToShow.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // เมื่อคลิกการ์ด ให้ Copy ID
                card.onclick = () => copyToClipboard(item.id, card);
                
                card.innerHTML = `
                    <div class="copy-msg">COPIED</div>
                    <img src="${item.path}" loading="lazy" 
                         onerror="this.style.opacity='0.1'"> 
                    <div class="card-details">
                        <span class="card-id">${item.id}</span>
                    </div>
                `;
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        function copyToClipboard(text, card) {
            if(text === "-" || text === "") return; // ถ้าไม่มีข้อมูล ไม่ต้อง Copy
            
            navigator.clipboard.writeText(text).then(() => {
                card.classList.add('copied');
                setTimeout(() => card.classList.remove('copied'), 800);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderPage(currentTab, e.target.value);
        });

        // เริ่มทำงาน
        init();

    </script>
</body>
</html>
