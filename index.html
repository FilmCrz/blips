<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIPS GALLERY - RDR2 STYLE</title>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Rye&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rdr-red: #cc0000;
            --rdr-dark-red: #8a0000;
            --rdr-black: #0a0a0a;
            --rdr-paper: #dccbba;
            --rdr-text-paper: #2b2b2b;
            --text-primary: #e0e0e0;
        }

        body {
            font-family: 'Crimson Text', serif;
            background-color: var(--rdr-black);
            background-image: 
                radial-gradient(circle at center, #1a1a1a 0%, #000000 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Toolbar for Export */
        .toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .btn-action {
            background-color: var(--rdr-paper);
            color: #333;
            border: 2px solid #5c4033;
            padding: 8px 15px;
            font-family: 'Rye', serif;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-action:hover {
            background-color: #fff;
            transform: scale(1.05);
        }

        header {
            background-color: var(--rdr-red);
            background-image: linear-gradient(to bottom, #cc0000, #8a0000);
            width: 100%;
            padding: 30px 0 50px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 4px solid #000;
        }

        h1 {
            margin: 0 0 20px 0;
            font-family: 'Rye', serif;
            font-weight: 400;
            font-size: 42px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
        }

        .search-box {
            position: relative;
            width: 90%;
            max-width: 600px;
            transform: translateY(20px);
            z-index: 101;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            padding-left: 50px;
            border-radius: 2px;
            border: 2px solid #5c4033;
            background-color: var(--rdr-paper);
            color: var(--rdr-text-paper);
            font-family: 'Crimson Text', serif;
            font-weight: 600;
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .search-box input:focus {
            border-color: #fff;
            background-color: #fff;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #5c4033;
            font-size: 20px;
        }

        .info-bar {
            margin-top: 5px;
            font-family: 'Rye', serif;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            padding: 40px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: #1a1a1a;
            border-radius: 2px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
            transition: all 0.2s;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .card:hover {
            border-color: var(--rdr-red);
            background-color: #222;
        }

        .card img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.1));
            cursor: pointer; /* Click image to copy */
        }

        .card-details {
            text-align: center;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 8px;
            margin-top: 5px;
        }

        /* Editable ID Styling */
        .card-id {
            color: var(--rdr-paper);
            font-family: 'Rye', serif;
            font-size: 13px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            cursor: text;
            padding: 2px 5px;
            border: 1px dashed transparent;
            transition: 0.2s;
            min-width: 50px;
            display: inline-block;
        }

        .card-id:hover {
            border-color: #666;
            background-color: #333;
        }

        .card-id.editing {
            background-color: var(--rdr-paper);
            color: #000;
            border: 1px solid var(--rdr-red);
            outline: none;
            min-width: 100px;
        }

        .card-name {
            font-size: 11px;
            color: #888;
            font-style: italic;
            user-select: none;
        }

        /* Copy Feedback */
        .copy-msg {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: var(--rdr-red);
            color: white;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card.copied .copy-msg { opacity: 1; }

        /* Modal for Export */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }
        .modal-content {
            background-color: var(--rdr-paper);
            margin: 10% auto;
            padding: 20px;
            border: 4px solid #5c4033;
            width: 80%;
            max-width: 600px;
            color: #000;
            position: relative;
        }
        .close {
            color: #8a0000;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-top: 10px;
            background: #fff;
            color: #000;
            font-family: monospace;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-action" onclick="exportData()">💾 Export Data</button>
    </div>

    <header>
        <h1>Blips Gallery</h1>
        <div class="info-bar" id="countDisplay">LOADING...</div>
        <div class="search-box">
            <span class="search-icon">✦</span>
            <input type="text" id="searchInput" placeholder="ค้นหา ID หรือ ชื่อไฟล์...">
        </div>
    </header>

    <div class="container">
        <div id="grid" class="grid"></div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="font-family: 'Rye', serif; margin-top: 0;">Export Data</h2>
            <p>ก๊อปปี้โค้ดด้านล่างไปทับตัวแปร <b>CUSTOM_DATA</b> ในไฟล์ index.html เพื่อบันทึกถาวร:</p>
            <textarea id="exportText" readonly></textarea>
            <button class="btn-action" style="margin-top: 10px;" onclick="copyExportText()">Copy Code</button>
        </div>
    </div>

    <script>
        // =========================================================================
        //  CONFIGURATION
        // =========================================================================
        const TOTAL_IMAGES = 1195; 
        const FOLDER_PATH = "index.files/";
        
        // -------------------------------------------------------------------------
        //  CUSTOM DATA (ส่วนนี้จะถูกแทนที่เมื่อคุณแปะโค้ดใหม่)
        // -------------------------------------------------------------------------
        const CUSTOM_DATA = [
            // { "img": "image001.png", "id": "-1018164873" },
        ];

        // =========================================================================
        //  APP LOGIC
        // =========================================================================

        const gridElement = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const countDisplay = document.getElementById('countDisplay');
        const modal = document.getElementById('exportModal');
        const exportText = document.getElementById('exportText');

        let allIcons = [];

        function init() {
            // 1. Load basic structure
            let baseData = [];

            if (CUSTOM_DATA.length > 0) {
                baseData = CUSTOM_DATA;
            } else {
                for (let i = 1; i <= TOTAL_IMAGES; i++) {
                    const numStr = i.toString().padStart(3, '0');
                    baseData.push({
                        img: `image${numStr}.png`,
                        id: "UNKNOWN"
                    });
                }
            }

            // 2. Merge with LocalStorage (User edits)
            const savedData = localStorage.getItem('rdr2_icons_data');
            if (savedData) {
                const parsedSaved = JSON.parse(savedData);
                // Update IDs based on filename matching
                baseData.forEach(item => {
                    if (parsedSaved[item.img]) {
                        item.id = parsedSaved[item.img];
                    }
                });
            }

            // 3. Transform to working array
            allIcons = baseData.map(item => ({
                id: item.id,
                filename: item.img,
                path: FOLDER_PATH + item.img
            }));

            renderGrid(allIcons);
        }

        function renderGrid(data) {
            gridElement.innerHTML = '';
            countDisplay.innerText = `WANTED: ${data.length} ICONS`;

            const fragment = document.createDocumentFragment();

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // HTML Structure
                card.innerHTML = `
                    <div class="copy-msg">Copied</div>
                    <img src="${item.path}" loading="lazy" 
                         onclick="copyToClipboard('${item.id}', this.parentNode)"
                         onerror="this.style.opacity='0.3'">
                    <div class="card-details">
                        <div class="card-id" 
                             contenteditable="true" 
                             spellcheck="false"
                             data-filename="${item.filename}"
                             onfocus="enterEditMode(this)"
                             onblur="saveEdit(this)">${item.id}</div>
                        <div class="card-name">${item.filename}</div>
                    </div>
                `;
                fragment.appendChild(card);
            });

            gridElement.appendChild(fragment);
        }

        // --- Editing Logic ---

        function enterEditMode(el) {
            el.classList.add('editing');
            if(el.innerText === "UNKNOWN") {
                el.innerText = ""; // Clear placeholder text
            }
        }

        function saveEdit(el) {
            el.classList.remove('editing');
            let newId = el.innerText.trim();
            const filename = el.dataset.filename;

            if (newId === "") {
                newId = "UNKNOWN";
                el.innerText = newId;
            }

            // Update in Memory
            const iconIndex = allIcons.findIndex(i => i.filename === filename);
            if (iconIndex > -1) {
                allIcons[iconIndex].id = newId;
            }

            // Save to LocalStorage
            saveToStorage();
        }

        function saveToStorage() {
            // Create a map of filename -> id to save space
            const mapToSave = {};
            allIcons.forEach(icon => {
                if (icon.id !== "UNKNOWN") {
                    mapToSave[icon.filename] = icon.id;
                }
            });
            localStorage.setItem('rdr2_icons_data', JSON.stringify(mapToSave));
        }

        // --- Utilities ---

        function copyToClipboard(text, card) {
            if(text === "UNKNOWN" || text === "") return;
            navigator.clipboard.writeText(text);
            card.classList.add('copied');
            setTimeout(() => card.classList.remove('copied'), 1000);
        }

        // --- Export Feature ---

        function exportData() {
            // Generate JSON strictly formatted for JS code
            const exportArray = allIcons.map(icon => {
                return `    { "img": "${icon.filename}", "id": "${icon.id}" }`;
            });
            
            const jsonString = `const CUSTOM_DATA = [\n${exportArray.join(',\n')}\n];`;
            
            exportText.value = jsonString;
            modal.style.display = "block";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function copyExportText() {
            exportText.select();
            document.execCommand("copy");
            alert("Code copied! Now paste it into index.html to update it.");
        }

        // Close modal if clicked outside
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // --- Search ---
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allIcons.filter(item => 
                item.id.toLowerCase().includes(keyword) || 
                item.filename.toLowerCase().includes(keyword)
            );
            renderGrid(filtered);
        });

        // Start
        init();

    </script>
</body>
</html>
